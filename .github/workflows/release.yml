name: STC32 toolchain release

on:
  push:
    tags:
      - 'stc32-mt3-support-*'

permissions:
  contents: read

concurrency:
  group: stc32-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  legal-approval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tagged source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          case "$GITHUB_REF_NAME" in
            stc32-mt3-support-*) ;;
            *) echo "unexpected release tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
      - name: Require qualified legal approval before binary generation
        run: >-
          python3 support/stc32/tools/check_legal_review.py
          --require-binary-release-approval

  posix-packages:
    needs: legal-approval
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            host_os: Linux
            host_arch: x86_64
          - runner: macos-15
            platform: macos-arm64
            host_os: Darwin
            host_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison build-essential flex libboost-dev libboost-graph-dev \
            libreadline-dev libzstd-dev python3 zlib1g-dev
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install boost bison flex
          printf '%s/bin\n' "$(brew --prefix bison)" >> "$GITHUB_PATH"
          printf '%s/bin\n' "$(brew --prefix flex)" >> "$GITHUB_PATH"
      - name: Configure build paths
        run: |
          printf 'BUILD_DIR=%s/stc32-build\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PREFIX=%s/stc32-install\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'DIST_DIR=%s/stc32-dist\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build and install
        run: env -u COMPILER_PATH -u SDCC_HOME bash support/stc32/scripts/build-toolchain.sh
      - name: Verify install boundary
        run: >-
          python3 support/stc32/tools/verify_install.py "$PREFIX"
          --expect-host-os "${{ matrix.host_os }}"
          --expect-host-arch "${{ matrix.host_arch }}"
      - name: Run core and product regression gates
        env:
          STC32_REGRESSION_RUN_ID: release-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
        run: bash support/stc32/scripts/run-posix-gates.sh --regression
      - name: Package and verify release assets
        run: |
          python3 support/stc32/tools/package_install.py \
            "$PREFIX" "$DIST_DIR" \
            --tag "$GITHUB_REF_NAME" --platform "${{ matrix.platform }}"
          python3 support/stc32/tools/verify_release_assets.py \
            "$DIST_DIR" --tag "$GITHUB_REF_NAME" \
            --source-commit "$GITHUB_SHA" --platform "${{ matrix.platform }}"
      - name: Upload validated workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openstc32-toolchain-${{ github.ref_name }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/stc32-dist/
          if-no-files-found: error
          retention-days: 30

  windows-package:
    needs: legal-approval
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      JOBS: 2
    steps:
      - name: Preserve LF line endings
        shell: pwsh
        run: git config --global core.autocrlf input
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            bison
            diffutils
            flex
            git
            make
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pyserial
            mingw-w64-ucrt-x86_64-python-yaml
            patch
            python
      - name: Configure build paths
        shell: msys2 {0}
        run: |
          git config --global --add safe.directory "$(pwd -W)"
          git fetch --no-tags origin stc32
          git cat-file -e '6962481^{commit}'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          runner_temp_posix="$(cygpath -u "$RUNNER_TEMP")"
          printf 'BUILD_DIR=%s/stc32-build\n' "$runner_temp_posix" >> "$GITHUB_ENV"
          printf 'PREFIX=%s/stc32-install\n' "$runner_temp_posix" >> "$GITHUB_ENV"
          printf 'DIST_DIR=%s/stc32-dist\n' "$runner_temp_posix" >> "$GITHUB_ENV"
      - name: Build, install, and run product gates
        shell: msys2 {0}
        env:
          STC32_REGRESSION_RUN_ID: release-${{ github.run_id }}-${{ github.run_attempt }}-windows-x86_64
        run: bash support/stc32/scripts/build-windows.sh --gates
      - name: Verify install boundary
        shell: msys2 {0}
        run: >-
          python support/stc32/tools/verify_install.py "$PREFIX"
          --expect-host-os Windows --expect-host-arch AMD64
      - name: Package and verify release assets
        shell: msys2 {0}
        run: |
          python support/stc32/tools/package_install.py \
            "$PREFIX" "$DIST_DIR" \
            --tag "$GITHUB_REF_NAME" --platform windows-x86_64
          python support/stc32/tools/verify_release_assets.py \
            "$DIST_DIR" --tag "$GITHUB_REF_NAME" \
            --source-commit "$GITHUB_SHA" --platform windows-x86_64
      - name: Upload validated workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openstc32-toolchain-${{ github.ref_name }}-windows-x86_64
          path: ${{ runner.temp }}/stc32-dist/
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: [posix-packages, windows-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download validated platform assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: openstc32-toolchain-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true
      - name: Revalidate the complete release set
        run: |
          python3 support/stc32/tools/check_legal_review.py \
            --require-binary-release-approval
          python3 support/stc32/tools/verify_release_assets.py \
            dist --tag "$GITHUB_REF_NAME" --source-commit "$GITHUB_SHA" \
            --platform linux-x86_64 \
            --platform macos-arm64 \
            --platform windows-x86_64
      - name: Publish one complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Validated GitHub-hosted builds for Ubuntu 24.04 x86_64, macOS 15 arm64, and Windows Server 2025 x86_64. Each package includes complete install manifests and a SHA-256 checksum. This is E5 build and regression evidence only; it does not claim STC32G12K128 real-board E4 acceptance."
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "OpenSTC32 toolchain $GITHUB_REF_NAME" \
              --notes "$notes"
          fi
