name: STC32 toolchain

on:
  push:
    branches: [stc32]
  pull_request:
    branches: [stc32]

permissions:
  contents: read

concurrency:
  group: stc32-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison build-essential flex libboost-dev libboost-graph-dev \
            libreadline-dev libzstd-dev python3 zlib1g-dev
      - name: Configure build paths
        run: |
          printf 'BUILD_DIR=%s/stc32-build\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PREFIX=%s/stc32-install\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'DIST_DIR=%s/stc32-dist\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Validate source and build policy
        run: |
          bash -n support/stc32/scripts/build-toolchain.sh
          python3 support/stc32/tools/check_legal_review.py
      - name: Build and install
        run: env -u COMPILER_PATH -u SDCC_HOME bash support/stc32/scripts/build-toolchain.sh
      - name: Verify complete install boundary
        run: >-
          python3 support/stc32/tools/verify_install.py "$PREFIX"
          --expect-host-os Linux --expect-host-arch x86_64
      - name: Run core and product regression gates
        env:
          STC32_REGRESSION_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash support/stc32/scripts/run-posix-gates.sh --regression
      - name: Validate release package without uploading
        run: |
          tag="ci-${GITHUB_SHA}"
          python3 support/stc32/tools/package_install.py \
            "$PREFIX" "$DIST_DIR" --tag "$tag" --platform linux-x86_64
          python3 support/stc32/tools/verify_release_assets.py \
            "$DIST_DIR" --tag "$tag" --source-commit "$GITHUB_SHA" \
            --platform linux-x86_64
      - name: Upload regression diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stc32-build/support/regression/gen-directed-ci-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/stc32-build/support/regression/results-directed-ci-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7
